<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hepilot</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #fafbfc;
    --panel-2: #f3f4f6;
    --border: #e4e7eb;
    --border-soft: #eef0f2;
    --fg: #1f2328;
    --dim: #59636e;
    --faint: #8b949e;
    --accent: #1f6feb;
    --accent-soft: #eaf1fe;
    --ok: #1a7f37;
    --ok-soft: #f0f9f2;
    --warn: #9a6700;
    --warn-soft: #fffaef;
    --err: #cf222e;
    --err-soft: #fff5f5;
    --shadow: 0 1px 2px rgba(27, 31, 36, .06), 0 3px 8px rgba(27, 31, 36, .04);
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--sans);
    font-size: 14px; line-height: 1.6; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; font-size: inherit; cursor: pointer; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d8dee4; border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #c6cdd5; }
  ::-webkit-scrollbar-track { background: transparent; }

  .app { display: grid; grid-template-columns: 278px 1fr; height: 100vh; }

  /* ---------------- sidebar ---------------- */
  .side { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 16px 16px 10px; font-weight: 600; }
  .brand .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--fg); }
  .brand-sub { font-size: 11px; color: var(--faint); font-weight: 400; margin-left: auto; font-family: var(--mono); }

  .new-btn {
    margin: 0 12px 10px; padding: 9px 12px; border-radius: 8px;
    background: var(--fg); color: #fff; border: none; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .new-btn:hover { opacity: .87; }
  .new-btn:disabled { opacity: .5; cursor: wait; }
  .sub-link {
    margin: -4px 12px 10px; padding: 2px 0; font-size: 11px; color: var(--faint);
    font-family: var(--mono); cursor: pointer; user-select: none;
  }
  .sub-link:hover { color: var(--accent); }

  /* ---------------- picker modal ---------------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(27, 31, 36, .32);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .overlay.show { display: flex; }
  .modal {
    width: 680px; max-width: calc(100vw - 40px); max-height: calc(100vh - 90px);
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 12px 40px rgba(27, 31, 36, .18);
  }
  .modal h3 { margin: 0; padding: 16px 18px 10px; font-size: 15px; font-weight: 500; }
  .path-row { display: flex; gap: 8px; padding: 0 18px 10px; }
  .path-row input {
    flex: 1; background: #fff; border: 1px solid var(--border); border-radius: 7px;
    padding: 7px 10px; font-family: var(--mono); font-size: 12px; color: var(--fg); outline: none;
  }
  .path-row input:focus { border-color: #b6cdf7; box-shadow: 0 0 0 3px var(--accent-soft); }
  .recent { padding: 0 18px 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .recent .chip2 {
    font-family: var(--mono); font-size: 11px; border: 1px solid var(--border);
    background: var(--panel); border-radius: 5px; padding: 3px 8px; cursor: pointer;
    color: var(--dim); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .recent .chip2:hover { border-color: var(--accent); color: var(--accent); }
  .recent .chip2.drive { color: var(--fg); font-weight: 500; }
  .recent .chip2.drive:hover { background: var(--accent-soft); }
  .inline-input {
    width: 190px; border: 1px solid var(--border); border-radius: 7px;
    padding: 5px 8px; font-family: var(--mono); font-size: 12px;
    color: var(--fg); background: #fff; outline: none;
  }
  .inline-input:focus { border-color: #b6cdf7; box-shadow: 0 0 0 3px var(--accent-soft); }
  .hidden { display: none !important; }
  .entries { flex: 1; overflow-y: auto; border-top: 1px solid var(--border-soft); min-height: 220px; }
  .entry {
    display: flex; align-items: center; gap: 8px; padding: 6px 18px;
    font-family: var(--mono); font-size: 12px; color: var(--dim); cursor: pointer;
  }
  .entry:hover { background: var(--panel-2); color: var(--fg); }
  .entry .repo { color: var(--ok); font-size: 10px; }
  .modal-foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 12px 18px; border-top: 1px solid var(--border-soft); }
  .modal-err { color: var(--err); font-family: var(--mono); font-size: 12px; padding: 0 18px 8px; min-height: 18px; }

  .search-box { margin: 0 12px 8px; }
  .search-box input {
    width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 9px; font-size: 12px; font-family: var(--sans); color: var(--fg); outline: none;
  }
  .search-box input:focus { border-color: #b6cdf7; box-shadow: 0 0 0 3px var(--accent-soft); }

  .sessions { flex: 1; overflow-y: auto; padding-bottom: 12px; }

  .group-head {
    display: flex; align-items: center; gap: 6px; padding: 8px 12px 4px;
    font-size: 11px; color: var(--faint); font-family: var(--mono);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  .group-head:hover { color: var(--dim); }
  .group-head .caret { width: 10px; display: inline-block; }
  .group-head .gpath { overflow: hidden; text-overflow: ellipsis; }
  .group-head .count { margin-left: auto; opacity: .7; }

  .session { margin: 1px 8px; padding: 6px 9px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; }
  .session:hover { background: var(--panel-2); }
  .session.active { background: var(--accent-soft); border-color: #cfe0fb; }
  .session .row1 { display: flex; align-items: center; gap: 6px; }
  .session .t { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .session .m { font-size: 11px; color: var(--faint); font-family: var(--mono); margin-top: 1px; }
  .session input.rename {
    width: 100%; border: 1px solid var(--accent); border-radius: 4px;
    padding: 1px 5px; font-size: 13px; font-family: var(--sans); outline: none;
  }
  .badge { display: inline-block; padding: 0 5px; border-radius: 3px; font-size: 10px; font-family: var(--mono); }
  .badge.running { background: var(--warn-soft); color: var(--warn); }
  .badge.interrupted { background: var(--err-soft); color: var(--err); }

  /* ---------------- main ---------------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar { height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
  .tabs { display: flex; gap: 2px; background: var(--panel-2); padding: 2px; border-radius: 8px; }
  .tab { border: none; background: transparent; padding: 5px 14px; border-radius: 6px; color: var(--dim); font-size: 13px; }
  .tab.active { background: #fff; color: var(--fg); box-shadow: var(--shadow); font-weight: 500; }
  .topbar .title { font-weight: 500; font-size: 14px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip {
    font-family: var(--mono); font-size: 11px; color: var(--dim);
    background: var(--panel); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 5px; white-space: nowrap;
    max-width: 420px; overflow: hidden; text-overflow: ellipsis;
  }
  .spacer { flex: 1; }
  .ghost { border: 1px solid var(--border); background: #fff; border-radius: 7px; padding: 4px 10px; font-size: 12px; color: var(--dim); }
  .ghost:hover { background: var(--panel-2); color: var(--fg); }

  .pane { flex: 1; overflow-y: auto; min-height: 0; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 22px 24px 40px; }

  .empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--faint); gap: 8px; text-align: center; }
  .empty h2 { color: var(--fg); font-weight: 500; margin: 0; font-size: 19px; }
  .empty p { margin: 0; font-size: 13px; }

  /* ---------------- turn card ---------------- */
  .turn {
    border: 1px solid var(--border); border-radius: 12px; background: #fff;
    margin: 14px 0; box-shadow: var(--shadow); overflow: hidden;
  }
  .turn-head { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border-soft); }
  .turn-label { font-family: var(--mono); font-size: 10px; color: var(--faint); letter-spacing: .8px; text-transform: uppercase; }
  .turn-user { white-space: pre-wrap; word-break: break-word; margin-top: 3px; }

  .turn-body { padding: 4px 16px; }
  .step { padding: 9px 0; border-bottom: 1px dashed var(--border-soft); }
  .step:last-child { border-bottom: none; }
  .step-head { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; }
  .step-name { color: var(--fg); font-weight: 500; }
  .step-args { color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .step-toggle { color: var(--faint); font-size: 11px; user-select: none; cursor: pointer; }
  .tool-group-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 0; border: 0; border-bottom: 1px dashed var(--border-soft); background: transparent; color: var(--dim); text-align: left; cursor: pointer; }
  .tool-group-label { flex: 0 0 auto; font-size: 12px; }
  .tool-group-names { overflow: hidden; color: var(--faint); font-family: var(--mono); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .tool-group-toggle { flex: 0 0 auto; margin-left: auto; color: var(--faint); font-size: 11px; }
  .step-result { margin-top: 6px; font-family: var(--mono); font-size: 12px; color: var(--dim); background: var(--panel); border: 1px solid var(--border-soft); border-radius: 7px; padding: 8px 10px; }
  .step-result pre { margin: 0; white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow: auto; }
  .step.collapsed .step-result { display: none; }
  .pill { font-size: 10px; font-family: var(--mono); padding: 0 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--faint); }
  .pill.bad { border-color: #f3bdbe; color: var(--err); background: var(--err-soft); }

  .turn-foot { padding: 12px 16px; border-top: 1px solid var(--border-soft); }
  .answer { white-space: pre-wrap; word-break: break-word; }
  .answer.markdown { white-space: normal; }
  .markdown > :first-child { margin-top: 0; }
  .markdown > :last-child { margin-bottom: 0; }
  .markdown h1, .markdown h2, .markdown h3, .markdown h4 { line-height: 1.35; margin: 1em 0 .45em; font-weight: 600; }
  .markdown h1 { font-size: 1.45em; }
  .markdown h2 { font-size: 1.28em; }
  .markdown h3 { font-size: 1.12em; }
  .markdown h4 { font-size: 1em; }
  .markdown p, .markdown ul, .markdown ol, .markdown blockquote, .markdown pre, .markdown table { margin: .65em 0; }
  .markdown ul, .markdown ol { padding-left: 1.6em; }
  .markdown li + li { margin-top: .2em; }
  .markdown blockquote { padding: 2px 12px; border-left: 3px solid var(--border); color: var(--dim); }
  .markdown a { color: var(--accent); text-decoration: none; }
  .markdown a:hover { text-decoration: underline; }
  .markdown :not(pre) > code { padding: 1px 5px; border: 1px solid var(--border-soft); border-radius: 4px; background: var(--panel); font-family: var(--mono); font-size: .9em; }
  .markdown pre { overflow-x: auto; padding: 10px 12px; border: 1px solid var(--border-soft); border-radius: 7px; background: var(--panel); }
  .markdown pre code { font-family: var(--mono); font-size: 12px; white-space: pre; }
  .markdown table { display: block; width: max-content; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
  .markdown th, .markdown td { padding: 5px 9px; border: 1px solid var(--border); text-align: left; }
  .markdown th { background: var(--panel); font-weight: 600; }
  .markdown hr { border: 0; border-top: 1px solid var(--border); margin: 1em 0; }
  .answer.streaming::after { content: "▍"; color: var(--accent); margin-left: 1px; animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  .kbadge { display: inline-block; font-family: var(--mono); font-size: 10px; padding: 1px 7px; border-radius: 4px; margin-bottom: 5px; border: 1px solid transparent; }
  .kbadge.muted { color: var(--faint); border-color: var(--border); background: var(--panel); }
  .kbadge.ok { color: var(--ok); border-color: #a7d3b3; background: var(--ok-soft); }
  .kbadge.warn { color: var(--warn); border-color: #f0d9a8; background: var(--warn-soft); }
  .turn-meta { font-family: var(--mono); font-size: 10px; color: var(--faint); margin-top: 6px; }
  .err { border-left: 2px solid var(--err); padding: 4px 10px; color: #a40e26; font-family: var(--mono); font-size: 12px; margin-top: 8px; }

  .approval { border: 1px solid #f0d9a8; background: var(--warn-soft); border-radius: 9px; padding: 10px 12px; margin: 8px 0; }
  .approval .h { font-size: 12px; color: var(--warn); font-family: var(--mono); }
  .approval .b { display: flex; gap: 8px; margin-top: 8px; }
  .btn { padding: 5px 13px; border-radius: 6px; border: 1px solid var(--border); background: #fff; color: var(--fg); }
  .btn:hover { background: var(--panel-2); }
  .btn.ok { border-color: #a7d3b3; color: var(--ok); }
  .btn.no { border-color: #f3bdbe; color: var(--err); }

  /* ---------------- trajectory ---------------- */
  .trail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: var(--faint); font-family: var(--mono); font-size: 11px; }
  .trail-turn { border: 1px solid var(--border); border-radius: 12px; background: #fff; margin: 12px 0; box-shadow: var(--shadow); overflow: hidden; }
  .trail-top { display: grid; grid-template-columns: 44px 1fr 90px 90px; gap: 12px; align-items: center; padding: 12px 16px; cursor: pointer; }
  .trail-top:hover { background: var(--panel); }
  .trail-num { font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .trail-prompt { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trail-dur, .trail-status { font-family: var(--mono); font-size: 11px; color: var(--dim); text-align: right; }
  .trail-steps { border-top: 1px solid var(--border-soft); padding: 6px 16px 12px; }
  .trail-row { display: grid; grid-template-columns: 150px 1fr 72px; gap: 10px; padding: 5px 0; font-family: var(--mono); font-size: 12px; border-bottom: 1px dashed var(--border-soft); }
  .trail-row:last-child { border-bottom: none; }
  .trail-row .ev { color: var(--dim); }
  .trail-row .detail { color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trail-row .ms { text-align: right; color: var(--faint); }

  /* ---------------- composer ---------------- */
  .composer { flex: 0 0 auto; border-top: 1px solid var(--border); padding: 12px 0 16px; }
  .composer .wrap { padding-top: 0; padding-bottom: 0; display: flex; flex-direction: column; gap: 8px; }
  .input-wrap { display: flex; align-items: flex-end; gap: 8px; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; box-shadow: var(--shadow); }
  .input-wrap:focus-within { border-color: #b6cdf7; box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { flex: 1; resize: none; border: none; outline: none; background: transparent; color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.55; max-height: 180px; min-height: 24px; padding: 3px 0; }
  textarea:disabled { color: var(--faint); }
  .send { border: none; background: var(--accent); color: #fff; border-radius: 7px; padding: 7px 15px; font-weight: 500; }
  .send:disabled { opacity: .45; cursor: not-allowed; }
  .stop { border: 1px solid var(--border); background: #fff; color: var(--err); border-radius: 7px; padding: 7px 12px; }
  .stop:hover:not(:disabled) { background: var(--err-soft); border-color: #f3bdbe; }
  .stop:disabled { opacity: .45; cursor: not-allowed; color: var(--faint); }
  .hint { font-size: 11px; color: var(--faint); font-family: var(--mono); }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="dot"></span><span>hepilot</span><span class="brand-sub" id="modelChip">local</span></div>
    <button class="new-btn" id="newBtn">＋ 新建会话</button>
    <div class="sub-link" id="manualBtn">手动输入路径</div>
    <div class="search-box"><input id="filter" placeholder="过滤会话…" /></div>
    <div class="sessions" id="sessions"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="tabs">
        <button class="tab active" id="tabChat">对话</button>
        <button class="tab" id="tabTrail">轨迹</button>
      </div>
      <span class="title" id="sessionTitle">未选择会话</span>
      <span class="chip" id="workspaceChip">—</span>
      <span class="spacer"></span>
      <span class="chip" id="statusChip">idle</span>
    </div>

    <div class="pane" id="pane">
      <div class="wrap" id="wrap">
        <div class="empty"><h2>开始一次会话</h2><p>点左上角「新建会话」，会弹出系统文件夹选择框。</p></div>
      </div>
    </div>

    <div class="composer" id="composer">
      <div class="wrap">
        <div class="input-wrap">
          <textarea id="input" rows="1" placeholder="描述你想做的事，Enter 发送，Shift+Enter 换行"></textarea>
          <button class="stop" id="stop" disabled>停止</button>
          <button class="send" id="send" disabled>发送</button>
        </div>
        <div class="hint" id="hint">选择一个会话后即可发送</div>
      </div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>选择工作区目录</h3>
    <div class="path-row">
      <input id="pathInput" placeholder="直接输入路径，或从下面的列表点进去" />
      <button class="ghost" id="upBtn">上一级</button>
    </div>
    <div class="recent" id="drives"></div>
    <div class="recent" id="recent"></div>
    <div class="entries" id="entries"></div>
    <div class="modal-err" id="modalErr"></div>
    <div class="modal-foot">
      <button class="ghost" id="mkdirBtn">＋ 新建文件夹</button>
      <input class="inline-input hidden" id="mkdirName" placeholder="文件夹名，回车创建" />
      <span style="flex:1"></span>
      <button class="ghost" id="cancelBtn">取消</button>
      <button class="btn ok" id="useBtn">用这个目录新建</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const STATUS_LABEL = { idle: "空闲", running: "运行中", interrupted: "已中断" };
const state = {
  sessions: [], current: null, view: "chat",
  lastSeq: 0, es: null, busy: false,
  items: [],          // 原始 transcript 条目
  turns: [],          // 由 items 折叠出的轮次
  expandedSteps: new Set(),
  expandedToolGroups: new Set(),
  collapsed: new Set(),
  filter: "",
  renaming: null,
};

/* ------------------------------ utils ------------------------------ */

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleString("zh-CN", { hour12: false, month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}
function fmtDur(ms) {
  if (ms === null || ms === undefined) return "";
  return ms >= 1000 ? (ms / 1000).toFixed(1) + "s" : Math.round(ms) + "ms";
}
function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function compactArgs(args) {
  if (!args || !Object.keys(args).length) return "";
  const text = JSON.stringify(args);
  return text.length > 110 ? text.slice(0, 110) + "…" : text;
}
function truncate(text, limit) {
  const s = String(text ?? "");
  return s.length > limit ? s.slice(0, limit) + `\n… (${s.length - limit} more chars)` : s;
}
async function api(path, options) {
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function sessionLabel(s) { return (s.name && s.name.trim()) || s.id; }

/* ------------------------------ sidebar ------------------------------ */

async function loadSessions() {
  const data = await api("/api/sessions");
  state.sessions = data.sessions || [];
  renderSessions();
}

function renderSessions() {
  const root = $("sessions");
  root.innerHTML = "";
  const filter = state.filter.trim().toLowerCase();
  const visible = state.sessions.filter((s) => {
    if (!filter) return true;
    return (s.workspace_root + " " + sessionLabel(s) + " " + s.id).toLowerCase().includes(filter);
  });
  if (!visible.length) {
    root.innerHTML = '<div class="group-head" style="cursor:default">没有匹配的会话</div>';
    return;
  }
  // 按工作区分组；同一项目的会话聚在一起
  const groups = new Map();
  for (const s of visible) {
    if (!groups.has(s.workspace_root)) groups.set(s.workspace_root, []);
    groups.get(s.workspace_root).push(s);
  }
  for (const [workspace, list] of groups) {
    const collapsed = state.collapsed.has(workspace);
    const head = document.createElement("div");
    head.className = "group-head";
    head.innerHTML = `<span class="caret">${collapsed ? "▸" : "▾"}</span>` +
      `<span class="gpath" title="${escapeHtml(workspace)}">${escapeHtml(shortPath(workspace))}</span>` +
      `<span class="count">${list.length}</span>`;
    head.onclick = () => {
      if (collapsed) state.collapsed.delete(workspace); else state.collapsed.add(workspace);
      renderSessions();
    };
    root.appendChild(head);
    if (collapsed) continue;
    for (const s of list) root.appendChild(sessionRow(s));
  }
}

function shortPath(path) {
  return String(path).replace(/^[A-Za-z]:[\\/]/, "").replace(/\\/g, "/");
}

function sessionRow(s) {
  const el = document.createElement("div");
  el.className = "session" + (s.id === state.current ? " active" : "");
  const badge = s.status === "running" ? ' <span class="badge running">运行中</span>'
    : s.status === "interrupted" ? ' <span class="badge interrupted">已中断</span>' : "";

  if (state.renaming === s.id) {
    const input = document.createElement("input");
    input.className = "rename";
    input.value = s.name || "";
    input.placeholder = s.id;
    const commit = async (save) => {
      const value = input.value.trim();
      state.renaming = null;
      if (save) {
        try {
          await api(`/api/sessions/${s.id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: value }),
          });
          s.name = value;
        } catch (err) { console.error(err); }
      }
      renderSessions();
      if (state.current === s.id) $("sessionTitle").textContent = sessionLabel(s);
    };
    input.onkeydown = (e) => {
      if (e.key === "Enter") commit(true);
      if (e.key === "Escape") commit(false);
    };
    input.onblur = () => commit(true);
    el.appendChild(input);
    setTimeout(() => input.focus(), 0);
  } else {
    el.innerHTML =
      `<div class="row1"><span class="t">${escapeHtml(sessionLabel(s))}</span>${badge}</div>` +
      `<div class="m">${fmtTime(s.updated_at) || "—"} · ${s.event_count} 事件</div>`;
    // 单击要延迟：openSession 会重建侧栏，元素一换 dblclick 就永远不会触发。
    let clickTimer = null;
    el.onclick = () => {
      clearTimeout(clickTimer);
      clickTimer = setTimeout(() => openSession(s.id), 220);
    };
    el.ondblclick = (e) => {
      e.preventDefault();
      clearTimeout(clickTimer);
      state.renaming = s.id;
      renderSessions();
    };
    el.title = s.id;
  }
  return el;
}

/* ------------------------------ turns ------------------------------ */

function buildTurns(items) {
  const turns = [];
  let cur = null;
  const ensure = () => {
    if (!cur) { cur = { user: "", steps: [], answer: "", answerKind: "", error: "", end: null, approvals: [], live: "", liveKind: "" }; turns.push(cur); }
    return cur;
  };
  for (const [itemIndex, it] of items.entries()) {
    if (it.kind === "user") {
      cur = { user: it.text || "", steps: [], answer: "", answerKind: "", error: "", end: null, approvals: [], live: "", liveKind: "" };
      turns.push(cur);
      continue;
    }
    const turn = ensure();
    switch (it.kind) {
      case "assistant":
        // 消息一旦落定，流式残留就该清掉：工具调用由下面的 steps 负责展示。
        turn.live = "";
        if (it.msgKind === "tool" || (it.toolUses && it.toolUses.length)) {
          break;
        }
        turn.answer = it.text || "";
        turn.answerKind = it.msgKind || "final";
        break;
      case "tool":
        turn.steps.push({ ...it, stepKey: itemIndex });
        break;
      case "delta":
        turn.live += it.text || "";
        turn.liveKind = it.streamKind || "text";
        break;
      case "assistant_start":
        turn.live = ""; turn.liveKind = "text";
        break;
      case "approval":
        turn.approvals.push(it);
        break;
      case "error":
        turn.error = it.message || "";
        break;
      case "run_end":
        turn.end = { status: it.status, stop: it.stopReason };
        turn.live = "";
        break;
      default:
        // checkpoint / approval_resolved 等不展示
        break;
    }
  }
  return turns;
}

/* ------------------------------ chat render ------------------------------ */

const KBADGE = {
  text: ["推理中", "muted"],
  tool: ["准备调用工具", "warn"],
  final: ["回答", "ok"],
  stopped: ["已停止", "warn"],
  retry: ["格式重试", "warn"],
};
// 查不到类型时的兜底，必须是真实存在的数组：
// 之前写成 KBADGE.ok（根本不存在的键），遇到 stopped 就整页渲染崩掉。
const BADGE_FALLBACK = ["回答", "ok"];
function badgeFor(kind) { return KBADGE[kind] || BADGE_FALLBACK; }

function safeMarkdownHref(value) {
  const href = String(value || "").trim();
  if (!href || /[\u0000-\u0020]/.test(href) || /^javascript:/i.test(href)) return "";
  if (/^(https?:|mailto:|#)/i.test(href)) return href;
  return "";
}

function renderInlineMarkdown(value) {
  const code = [];
  let text = String(value || "").replace(/`([^`]+)`/g, (_, body) => {
    const key = `\u0000CODE${code.length}\u0000`;
    code.push(`<code>${escapeHtml(body)}</code>`);
    return key;
  });
  text = escapeHtml(text);
  text = text.replace(/!\[([^\]]*)\]\(([^\s)]+)(?:\s+"([^"]*)")?\)/g, (_, alt, src, title) => {
    const href = safeMarkdownHref(src);
    return href ? `<img src="${escapeHtml(href)}" alt="${escapeHtml(alt)}"${title ? ` title="${escapeHtml(title)}"` : ""} loading="lazy" />` : escapeHtml(alt);
  });
  text = text.replace(/\[([^\]]+)\]\(([^\s)]+)(?:\s+"([^"]*)")?\)/g, (_, label, src, title) => {
    const href = safeMarkdownHref(src);
    return href ? `<a href="${escapeHtml(href)}"${title ? ` title="${escapeHtml(title)}"` : ""} target="_blank" rel="noopener noreferrer">${label}</a>` : label;
  });
  text = text.replace(/\*\*(.+?)\*\*|__(.+?)__/g, "<strong>$1$2</strong>");
  text = text.replace(/\*(.+?)\*|_(.+?)_/g, "<em>$1$2</em>");
  text = text.replace(/~~(.+?)~~/g, "<del>$1</del>");
  text = text.replace(/\u0000CODE(\d+)\u0000/g, (_, index) => code[Number(index)] || "");
  return text;
}

function renderMarkdown(source) {
  const lines = String(source || "").replace(/\r\n?/g, "\n").split("\n");
  const blocks = [];
  let paragraph = [];
  let list = null;
  let quote = [];
  let fence = null;
  let codeLines = [];
  const flushParagraph = () => {
    if (paragraph.length) blocks.push(`<p>${paragraph.map(renderInlineMarkdown).join("<br>")}</p>`);
    paragraph = [];
  };
  const flushList = () => {
    if (list) blocks.push(`<${list.type}>${list.items.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join("")}</${list.type}>`);
    list = null;
  };
  const flushQuote = () => {
    if (quote.length) blocks.push(`<blockquote>${renderMarkdown(quote.join("\n"))}</blockquote>`);
    quote = [];
  };
  const flushTextBlocks = () => { flushParagraph(); flushList(); flushQuote(); };
  const splitTableRow = (line) => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
  for (let index = 0; index < lines.length; index += 1) {
    const line = lines[index];
    const fenceMatch = line.match(/^\s*(```+|~~~+)([^`]*)$/);
    if (fence) {
      if (fenceMatch && fenceMatch[1][0] === fence.marker && fenceMatch[1].length >= fence.length) {
        blocks.push(`<pre><code${fence.lang ? ` class="language-${escapeHtml(fence.lang)}"` : ""}>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
        fence = null;
        codeLines = [];
      } else codeLines.push(line);
      continue;
    }
    if (fenceMatch) {
      flushTextBlocks();
      fence = { marker: fenceMatch[1][0], length: fenceMatch[1].length, lang: (fenceMatch[2].trim().split(/\s+/)[0] || "").replace(/[^\w+-]/g, "") };
      continue;
    }
    if (!line.trim()) { flushTextBlocks(); continue; }
    const quoteMatch = line.match(/^\s*>\s?(.*)$/);
    if (quoteMatch) { flushParagraph(); flushList(); quote.push(quoteMatch[1]); continue; }
    flushQuote();
    const heading = line.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
    if (heading) { flushParagraph(); flushList(); blocks.push(`<h${heading[1].length}>${renderInlineMarkdown(heading[2])}</h${heading[1].length}>`); continue; }
    if (/^\s{0,3}(?:---+|___+|\*\s*)$/.test(line)) { flushTextBlocks(); blocks.push("<hr>"); continue; }
    if (line.includes("|") && index + 1 < lines.length && /^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[index + 1])) {
      flushTextBlocks();
      const headers = splitTableRow(line);
      const alignments = splitTableRow(lines[index + 1]).map((cell) => cell.startsWith(":") && cell.endsWith(":") ? "center" : cell.endsWith(":") ? "right" : cell.startsWith(":") ? "left" : "");
      const renderCells = (cells, tag) => headers.map((_, cellIndex) => `<${tag}${alignments[cellIndex] ? ` style="text-align:${alignments[cellIndex]}"` : ""}>${renderInlineMarkdown(cells[cellIndex] || "")}</${tag}>`).join("");
      const rows = [`<thead><tr>${renderCells(headers, "th")}</tr></thead>`];
      index += 2;
      const bodyRows = [];
      while (index < lines.length && lines[index].includes("|")) {
        bodyRows.push(`<tr>${renderCells(splitTableRow(lines[index]), "td")}</tr>`);
        index += 1;
      }
      index -= 1;
      if (bodyRows.length) rows.push(`<tbody>${bodyRows.join("")}</tbody>`);
      blocks.push(`<table>${rows.join("")}</table>`);
      continue;
    }
    const item = line.match(/^\s{0,3}([-+*]|\d+[.)])\s+(.+)$/);
    if (item) {
      flushParagraph();
      const type = /^\d/.test(item[1]) ? "ol" : "ul";
      if (list && list.type !== type) flushList();
      if (!list) list = { type, items: [] };
      list.items.push(item[2]);
      continue;
    }
    flushList();
    paragraph.push(line);
  }
  if (fence) blocks.push(`<pre><code${fence.lang ? ` class="language-${escapeHtml(fence.lang)}"` : ""}>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
  flushTextBlocks();
  return blocks.join("");
}

function renderChat() {
  const wrap = $("wrap");
  if (!state.turns.length) {
    wrap.innerHTML = '<div class="empty"><h2>开始一次会话</h2><p>点左上角「新建会话」，会弹出系统文件夹选择框。</p></div>';
    return;
  }
  // 单轮渲染失败不该让整个对话变空白：坏掉的那一轮单独报错，其余照常显示。
  wrap.innerHTML = state.turns.map((turn, index) => {
    try {
      return turnHtml(turn);
    } catch (err) {
      return `<div class="turn"><div class="turn-body"><div class="err">第 ${index + 1} 轮渲染失败：${escapeHtml(err.message)}</div></div></div>`;
    }
  }).join("");
  bindStepToggles(wrap);
}

function turnHtml(turn) {
  const parts = [];
  parts.push('<div class="turn">');
  if (turn.user) {
    parts.push(`<div class="turn-head"><div class="turn-label">you</div><div class="turn-user">${escapeHtml(turn.user)}</div></div>`);
  }
  const body = [];
  const pendingTools = turn.steps.length > 0 && turn.answerKind !== "final";
  const groupKey = turn.steps[0]?.stepKey;
  const groupExpanded = pendingTools && state.expandedToolGroups.has(groupKey);
  if (pendingTools) {
    const names = turn.steps.map((step) => escapeHtml(step.name || "tool")).join("、");
    body.push(`<button type="button" class="tool-group-head" data-tool-group-key="${groupKey}">` +
      `<span class="tool-group-label">${turn.steps.length} 个工具调用</span>` +
      `<span class="tool-group-names">${names}</span>` +
      `<span class="tool-group-toggle">${groupExpanded ? "收起" : "展开详情"}</span></button>`);
  }
  for (const step of (pendingTools && !groupExpanded ? [] : turn.steps)) {
    const bad = step.synthetic || /^error/i.test(step.result || "");
    const collapsed = !state.expandedSteps.has(step.stepKey);
    body.push(`<div class="step${collapsed ? " collapsed" : ""}" data-step-key="${step.stepKey}">`);
    body.push(`<div class="step-head">`);
    body.push(`<span class="step-name">${escapeHtml(step.name || "tool")}</span>`);
    body.push(`<span class="step-args">${escapeHtml(compactArgs(step.args))}</span>`);
    if (step.synthetic) body.push('<span class="pill bad">未执行</span>');
    body.push(`<span class="step-toggle">${collapsed ? "展开" : "收起"}</span></div>`);
    body.push(`<div class="step-result"><pre>${escapeHtml(truncate(step.result || "", 3000))}</pre></div>`);
    body.push("</div>");
  }
  for (const ap of turn.approvals) {
    body.push(`<div class="approval"><div class="h">需要审批 · ${escapeHtml(ap.name)}</div>` +
      `<div class="step-result"><pre>${escapeHtml(compactArgs(ap.args))}</pre></div>` +
      `<div class="b"><button class="btn ok" data-approve="1">允许</button><button class="btn no" data-deny="1">拒绝</button></div></div>`);
  }
  if (body.length) parts.push(`<div class="turn-body">${body.join("")}</div>`);

  const foot = [];
  if (turn.live) {
    const [label, cls] = KBADGE[turn.liveKind] || KBADGE.text;
    foot.push(`<div><span class="kbadge ${cls}">${label}</span></div>`);
    foot.push(`<div class="answer markdown streaming">${renderMarkdown(turn.live)}</div>`);
  } else if (turn.answer) {
    const [label, cls] = badgeFor(turn.answerKind);
    foot.push(`<div><span class="kbadge ${cls}">${label}</span></div>`);
    foot.push(`<div class="answer markdown">${renderMarkdown(turn.answer)}</div>`);
  }
  if (turn.error) foot.push(`<div class="err">${escapeHtml(turn.error)}</div>`);
  if (turn.end) {
    const label = turn.end.status === "completed" ? "本轮完成" : `本轮结束 · ${turn.end.stop || turn.end.status}`;
    foot.push(`<div class="turn-meta">${escapeHtml(label)}</div>`);
  }
  if (foot.length) parts.push(`<div class="turn-foot">${foot.join("")}</div>`);
  parts.push("</div>");
  return parts.join("");
}

function bindStepToggles(root) {
  root.querySelectorAll(".tool-group-head").forEach((head) => {
    head.onclick = () => {
      const groupKey = Number(head.dataset.toolGroupKey);
      if (state.expandedToolGroups.has(groupKey)) state.expandedToolGroups.delete(groupKey);
      else state.expandedToolGroups.add(groupKey);
      renderChat();
    };
  });
  root.querySelectorAll(".step-head").forEach((head) => {
    head.onclick = () => {
      const step = head.parentElement;
      step.classList.toggle("collapsed");
      const collapsed = step.classList.contains("collapsed");
      const stepKey = Number(step.dataset.stepKey);
      if (collapsed) state.expandedSteps.delete(stepKey);
      else state.expandedSteps.add(stepKey);
      head.querySelector(".step-toggle").textContent = collapsed ? "展开" : "收起";
    };
  });
}

function scrollBottom() { const pane = $("pane"); pane.scrollTop = pane.scrollHeight; }

/* ------------------------------ trajectory ------------------------------ */

async function renderTrail() {
  if (!state.current) return;
  const pane = $("pane");
  pane.innerHTML = '<div class="wrap"><div class="empty"><p>加载轨迹…</p></div></div>';
  try {
    const data = await api(`/api/sessions/${state.current}/trajectory`);
    const turns = data.turns || [];
    if (!turns.length) {
      pane.innerHTML = '<div class="wrap"><div class="empty"><h2>还没有轨迹</h2><p>发一条消息后这里会出现每一轮的执行时间线。</p></div></div>';
      return;
    }
    const html = turns.map((turn, index) => {
      const steps = (turn.steps || []).map((step) => {
        const detail = step.name
          ? `${escapeHtml(step.tool || "")} ${escapeHtml(compactArgs(step.args))}`
          : escapeHtml(step.stopReason || step.trigger || "");
        return `<div class="trail-row"><span class="ev">${escapeHtml(step.event)}</span>` +
          `<span class="detail">${detail}</span>` +
          `<span class="ms">${fmtDur(step.durationMs)}</span></div>`;
      }).join("");
      return `<div class="trail-turn">` +
        `<div class="trail-top" data-idx="${index}">` +
        `<span class="trail-num">#${turn.index}</span>` +
        `<span class="trail-prompt" title="${escapeHtml(turn.prompt)}">${escapeHtml(turn.prompt || "(空)")}</span>` +
        `<span class="trail-dur">${fmtDur(turn.durationMs)}</span>` +
        `<span class="trail-status">${escapeHtml(turn.status || "—")}</span>` +
        `</div>` +
        `<div class="trail-steps" style="display:none">${steps || '<div class="trail-row"><span class="detail">(无步骤)</span></div>'}</div>` +
        `</div>`;
    }).join("");
    const meta = `<div class="trail-head"><span>${turns.length} 轮</span><span>·</span><span>${data.eventCount} 个事件</span>` +
      `<span>·</span><span>${escapeHtml(data.session.workspace_root)}</span></div>`;
    pane.innerHTML = `<div class="wrap">${meta}${html}</div>`;
    pane.querySelectorAll(".trail-top").forEach((row) => {
      row.onclick = () => {
        const steps = row.nextElementSibling;
        steps.style.display = steps.style.display === "none" ? "block" : "none";
      };
    });
  } catch (err) {
    pane.innerHTML = `<div class="wrap"><div class="err">${escapeHtml(err.message)}</div></div>`;
  }
}

function setView(view) {
  state.view = view;
  $("tabChat").classList.toggle("active", view === "chat");
  $("tabTrail").classList.toggle("active", view === "trail");
  $("composer").style.display = view === "chat" ? "" : "none";
  if (view === "chat") {
    $("pane").innerHTML = '<div class="wrap" id="wrap"></div>';
    renderChat();
    scrollBottom();
  } else {
    renderTrail();
  }
}

/* ------------------------------ session ------------------------------ */

async function openSession(id) {
  state.current = id;
  state.lastSeq = 0;
  state.items = [];
  state.turns = [];
  state.expandedSteps = new Set();
  state.expandedToolGroups = new Set();
  closeStream();
  const data = await api(`/api/sessions/${id}`);
  state.lastSeq = data.lastSeq || 0;
  state.items = (data.transcript || []).slice();
  state.turns = buildTurns(state.items);
  const s = data.session;
  $("sessionTitle").textContent = sessionLabel(s);
  $("workspaceChip").textContent = s.workspace_root;
  $("workspaceChip").title = s.workspace_root;
  $("statusChip").textContent = STATUS_LABEL[s.status] || s.status || "idle";
  $("send").disabled = false;
  $("input").disabled = false;
  $("hint").textContent = s.status === "interrupted"
    ? "上次运行被中断（服务重启/崩溃）。可以直接继续发消息。"
    : "Enter 发送 · Shift+Enter 换行 · 双击左侧会话可重命名";
  renderSessions();
  setView(state.view);
  openStream(id, state.lastSeq);
}

function openStream(id, after) {
  const es = new EventSource(`/api/sessions/${id}/events?after=${after}`);
  state.es = es;
  es.onmessage = (ev) => {
    let event;
    try { event = JSON.parse(ev.data); } catch { return; }
    if (event.seq <= state.lastSeq) return;
    state.lastSeq = event.seq;
    const item = transcriptItem(event);
    if (item) {
      state.items.push(item);
      state.turns = buildTurns(state.items);
      if (state.view === "chat") {
        renderChat();
      }
    }
    if (event.type === "run_finished" || event.type === "run_failed") {
      state.busy = false;
      $("statusChip").textContent = STATUS_LABEL.idle;
      $("send").disabled = false;
      $("stop").disabled = true;
      loadSessions();
      if (state.view === "trail") renderTrail();
    }
  };
}

function closeStream() { if (state.es) { state.es.close(); state.es = null; } }

function transcriptItem(event) {
  const d = event.data || {};
  switch (event.type) {
    case "user_message": return { kind: "user", text: d.text };
    case "assistant_message": return { kind: "assistant", text: d.text, toolUses: d.tool_uses || [], msgKind: d.kind || "" };
    case "assistant_start": return { kind: "assistant_start" };
    case "assistant_delta": return { kind: "delta", text: d.text || "", streamKind: d.kind || "text" };
    case "tool_executed": return { kind: "tool", name: d.name, args: d.args, result: d.result, synthetic: d.synthetic };
    case "run_finished": return { kind: "run_end", status: d.status, stopReason: d.stop_reason };
    case "model_failed": return { kind: "error", message: d.error_message };
    case "approval_requested": return { kind: "approval", approvalId: d.approval_id, name: d.name, args: d.args };
    case "approval_resolved":
    case "checkpoint_created":
    default: return null;
  }
}

/* ------------------------------ actions ------------------------------ */

async function send() {
  const input = $("input");
  const text = input.value.trim();
  if (!text || !state.current || state.busy) return;
  state.busy = true;
  $("send").disabled = true;
  $("stop").disabled = false;
  $("statusChip").textContent = STATUS_LABEL.running;
  input.value = "";
  autosize();
  try {
    await api(`/api/sessions/${state.current}/messages`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
  } catch (err) {
    state.busy = false;
    $("send").disabled = false;
    $("stop").disabled = true;
    $("statusChip").textContent = STATUS_LABEL.idle;
    state.items.push({ kind: "error", message: err.message });
    state.turns = buildTurns(state.items);
    if (state.view === "chat") renderChat();
  }
}

async function stop() {
  if (!state.current || !state.busy) return;
  $("stop").disabled = true;
  $("statusChip").textContent = "正在停止…";
  try { await api(`/api/sessions/${state.current}/cancel`, { method: "POST" }); }
  catch (err) { console.error(err); }
}

async function pickFolder() {
  await api("/api/pick-folder", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: "{}",
  });
  const deadline = Date.now() + 180000;
  const cancelOnEsc = async (e) => {
    if (e.key !== "Escape") return;
    e.preventDefault();
    try { await api("/api/pick-folder/cancel", { method: "POST" }); } catch (err) { /* ignore */ }
  };
  document.addEventListener("keydown", cancelOnEsc);
  try {
    while (Date.now() < deadline) {
      await new Promise((resolve) => setTimeout(resolve, 600));
      const result = await api("/api/pick-folder");
      if (result.status === "done") return result.path;
      if (result.status === "error") throw new Error(result.error || "已取消选择");
    }
    throw new Error("选择超时");
  } finally {
    document.removeEventListener("keydown", cancelOnEsc);
  }
}

async function createSessionAt(path) {
  const data = await api("/api/sessions", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ workspace_root: path }),
  });
  await loadSessions();
  await openSession(data.session.id);
  $("hint").textContent = "Enter 发送 · Shift+Enter 换行 · 双击左侧会话可重命名";
}

let browsePath = "";

async function openPicker() {
  $("overlay").classList.add("show");
  $("modalErr").textContent = "";
  await loadDrives();
  const box = $("recent");
  box.innerHTML = "";
  try {
    const data = await api("/api/workspaces");
    for (const item of (data.workspaces || []).slice(0, 6)) {
      const chip = document.createElement("span");
      chip.className = "chip2";
      chip.textContent = item.workspace_root;
      chip.title = item.workspace_root + `（${item.sessions} 个会话）`;
      chip.onclick = () => browse(item.workspace_root);
      box.appendChild(chip);
    }
  } catch (err) { /* 最近工作区拿不到不影响手动浏览 */ }
  await browse("");
}

async function loadDrives() {
  const box = $("drives");
  box.innerHTML = "";
  try {
    const data = await api("/api/drives");
    for (const drive of data.drives || []) {
      const chip = document.createElement("span");
      chip.className = "chip2 drive";
      chip.textContent = drive;
      chip.onclick = () => browse(drive);
      box.appendChild(chip);
    }
  } catch (err) { /* 列不出盘符时仍可手输路径 */ }
}

async function newFolder() {
  const name = ($("mkdirName").value || "").trim();
  if (!name) return;
  try {
    const data = await api("/api/mkdir", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ parent: $("pathInput").value || browsePath, name }),
    });
    $("mkdirName").value = "";
    $("mkdirName").classList.add("hidden");
    $("modalErr").textContent = "";
    await browse(data.path);
  } catch (err) {
    $("modalErr").textContent = err.message;
  }
}

async function browse(path) {
  try {
    const data = await api(`/api/fs?path=${encodeURIComponent(path || "")}`);
    browsePath = data.path;
    $("pathInput").value = data.path;
    const list = $("entries");
    list.innerHTML = "";
    for (const entry of data.entries) {
      if (!entry.isDir) continue;
      const row = document.createElement("div");
      row.className = "entry";
      row.innerHTML = `📁 ${escapeHtml(entry.name)}` + (entry.isRepo ? ' <span class="repo">● git</span>' : "");
      row.onclick = () => browse(entry.path);
      list.appendChild(row);
    }
    if (!list.children.length) list.innerHTML = '<div class="entry" style="cursor:default">（没有子目录）</div>';
    $("modalErr").textContent = data.isRepo
      ? ""
      : "提示：这个目录不是 git 仓库，仍可使用，但仓库快照会少一部分信息。";
  } catch (err) {
    $("modalErr").textContent = err.message;
  }
}

async function useCurrentDir() {
  const path = ($("pathInput").value || browsePath || "").trim();
  if (!path) return;
  $("useBtn").disabled = true;
  try {
    await createSessionAt(path);
    $("overlay").classList.remove("show");
  } catch (err) {
    $("modalErr").textContent = err.message;
  } finally {
    $("useBtn").disabled = false;
  }
}

async function nativePick() {
  $("nativeBtn").disabled = true;
  $("modalErr").textContent = "正在等待系统对话框…（如果看不到，按 Esc 取消）";
  try {
    await browse(await pickFolder());
    $("modalErr").textContent = "";
  } catch (err) {
    $("modalErr").textContent = "系统对话框不可用：" + err.message + " —— 用上面的列表或直接输入路径即可。";
  } finally {
    $("nativeBtn").disabled = false;
  }
}

function newSession() {
  openPicker();
}

async function manualSession() {
  const path = window.prompt("输入工作区路径（例如 D:\\code\\myrepo）：", "");
  if (!path) return;
  try { await createSessionAt(path); }
  catch (err) { window.alert("创建失败：" + err.message); }
}

function autosize() {
  const input = $("input");
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
}

/* ------------------------------ wiring ------------------------------ */

$("newBtn").onclick = newSession;
$("manualBtn").onclick = () => { openPicker(); };
$("cancelBtn").onclick = () => $("overlay").classList.remove("show");
$("useBtn").onclick = useCurrentDir;
$("upBtn").onclick = () => {
  const current = ($("pathInput").value || browsePath || "").replace(/[\\/][^\\/]*$/, "");
  browse(current || browsePath);
};
$("nativeBtn") && ($("nativeBtn").onclick = nativePick);
$("pathInput").onkeydown = (e) => { if (e.key === "Enter") browse($("pathInput").value); };
$("mkdirBtn").onclick = () => {
  const input = $("mkdirName");
  input.classList.toggle("hidden");
  if (!input.classList.contains("hidden")) input.focus();
};
$("mkdirName").onkeydown = (e) => {
  if (e.key === "Escape") { e.target.value = ""; e.target.classList.add("hidden"); return; }
  if (e.key === "Enter") { e.preventDefault(); newFolder(); }
};
$("overlay").onclick = (e) => { if (e.target === $("overlay")) $("overlay").classList.remove("show"); };
$("tabChat").onclick = () => setView("chat");
$("tabTrail").onclick = () => setView("trail");
$("send").onclick = send;
$("stop").onclick = stop;
$("input").oninput = autosize;
$("input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
$("filter").oninput = (e) => { state.filter = e.target.value; renderSessions(); };
document.addEventListener("click", (e) => {
  const approve = e.target.closest("[data-approve]");
  const deny = e.target.closest("[data-deny]");
  if (!approve && !deny) return;
  const box = e.target.closest(".approval");
  const turn = state.turns[state.turns.length - 1];
  const ap = turn && turn.approvals[turn.approvals.length - 1];
  if (!ap) return;
  box.querySelectorAll("button").forEach((b) => (b.disabled = true));
  api(`/api/sessions/${state.current}/approvals/${ap.approvalId}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ approved: !!approve }),
  }).catch((err) => { console.error(err); });
});

loadSessions().catch((err) => console.error(err));
</script>
